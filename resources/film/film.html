          <div id="odo" style="font-size:104px;font-weight:900;line-height:1;color:#C6F432;display:flex;overflow:hidden;height:104px"></div>
          <div id="plus" style="font-size:30px;font-weight:900;color:#fff;margin-bottom:12px">+1</div>
        </div>
        <div style="margin-top:22px;display:flex;gap:10px" id="bars"></div>
      </div>
    </div>
    <!-- курсор клієнта -->
    <div class="abs" id="cur" style="left:0;top:0">
      <div id="ripple" class="abs" style="left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;border:3px solid #C6F432;box-sizing:border-box"></div>
      <svg width="34" height="34" viewBox="0 0 24 24" style="position:absolute;left:-4px;top:-3px"><path d="M4 2l15 8.5-6.4 1.6L9.5 18z" fill="#fff" stroke="#1E1F22" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <div id="pill" class="abs" style="left:28px;top:-34px;background:#fff;color:#1E1F22;font-weight:800;font-size:16px;padding:5px 12px;border-radius:99px;white-space:nowrap">Клієнт</div>
    </div>
  </div>
</div>

<script>
const LOOP = 8;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
function stepR(tau, { w, z }) {
  if (tau <= 0) return 0;
  if (z >= 1) { const x = w * tau; return 1 - Math.exp(-x) * (1 + x); }
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
}
class Track {
  constructor(v0) { this.v0 = v0; this.cur = v0; this.ev = []; }
  to(t, v, sp) { if (v !== this.cur) { this.ev.push([t, v - this.cur, sp]); this.cur = v; } return this; }
  at(t) { let v = this.v0; for (const [ti, d, sp] of this.ev) v += d * stepR(t - ti, sp); return v; }
}
function vis(t, tin, tout, dOut = 0.12) {
  const e = stepR(t - tin, { w: 26, z: 1 }), x = tout == null ? 0 : clamp((t - tout) / dOut), xo = x * x;
  return { o: e * (1 - xo), b: (1 - e) * 10 + xo * 10, dy: (1 - e) * 16 - xo * 10 };
}
const M = { w: 15, z: 0.82 };   // morph spring: tiny overshoot
const S = { w: 12, z: 1 };      // camera / position

// логотип: 640 px завширшки, центр літер у центрі кадру; крапка фігури = велика крапка над «i»
const LOGO = document.getElementById('logo'), K = 640 / 3431;
const LB = { x: 470, y: 300, w: 2560, h: 1070 };   // bbox «vismo agency» у координатах viewBox
const LX = 560 - (LB.x + LB.w / 2) * K, LY = 350 - (LB.y + LB.h / 2) * K;
LOGO.style.left = LX + 'px'; LOGO.style.top = LY + 'px';
const DOT_D = 2 * 92.56 * K, DOT_X = LX + 966.82 * K, DOT_Y = LY + 356.38 * K;
// states: [w, h, radius, r, g, b, cx, cy]
const ST = {
  dot:  [DOT_D, DOT_D, DOT_D / 2, 198, 244, 50, DOT_X, DOT_Y],
  ad:   [430, 430, 30, 38, 39, 43, 560, 350],
  msg:  [560, 128, 64, 198, 244, 50, 560, 350],
  note: [480, 104, 52, 255, 255, 255, 560, 350],
  stat: [470, 300, 30, 38, 39, 43, 560, 350],
};
const seq = [[0.9, 'ad'], [2.6, 'msg'], [4.1, 'note'], [5.2, 'stat'], [6.7, 'dot']];
const keys = ['w', 'h', 'r', 'cr', 'cg', 'cb', 'cx', 'cy'];
const T = {};
keys.forEach((k, i) => { T[k] = new Track(ST.dot[i]); seq.forEach(([t, s]) => T[k].to(t, ST[s][i], i >= 6 ? S : M)); });
// echo dots of the logo: vanish when the shape leaves, spring back when it returns
T.echo = new Track(1).to(0.75, 0, { w: 20, z: 1 }).to(7.0, 1, { w: 16, z: 0.75 });
// cursor
T.cx = T.cx; T.ux = new Track(1180).to(1.35, 680, S).to(3.05, 1200, { w: 9, z: 1 });
T.uy = new Track(760).to(1.35, 506, S).to(3.05, 760, { w: 9, z: 1 });
const CLICK = 2.45;
// camera push on the money moment
// base framing 1.3x: the loop plays ~520 px wide in the hero, so the shape must fill the frame
T.zoom = new Track(Math.log(1.3)).to(4.1, Math.log(1.38), S).to(6.7, Math.log(1.3), S);

const $ = id => document.getElementById(id);
const bars = $('bars');
for (let i = 0; i < 12; i++) bars.insertAdjacentHTML('beforeend', `<div class="dot" style="position:static;width:22px;height:22px"></div>`);

function setVis(el, v) { el.style.opacity = v.o; el.style.filter = `blur(${v.b}px)`; el.style.transform = `translateY(${v.dy}px)`; el.style.visibility = v.o < 0.01 ? 'hidden' : 'inherit'; }

function odo(v) {        // 47 -> 48: only the ones digit rolls
  const tens = 4, ones = 7 + v;
  return `<span>${tens}</span><span style="display:inline-block;height:104px;overflow:hidden"><span style="display:block;transform:translateY(${-v * 104}px)"><span style="display:block">${7}</span><span style="display:block">${8}</span></span></span>`;
}

window.seek = t => {
  t = ((t % LOOP) + LOOP) % LOOP;
  const v = {}; keys.forEach(k => v[k] = T[k].at(t));
  // beat pulse while it is the logo dot
  const inDot = t < 0.9 || t > 6.9;
  const beat = (t % 0.5) / 0.5, pulse = inDot ? 1 + 0.05 * Math.exp(-beat * 6) : 1;
  const sh = $('shape').style;
  const w = v.w * pulse, h = v.h * pulse;
  sh.width = w + 'px'; sh.height = h + 'px'; sh.borderRadius = v.r * pulse + 'px';
  sh.left = (v.cx - w / 2) + 'px'; sh.top = (v.cy - h / 2) + 'px';
  sh.background = `rgb(${v.cr},${v.cg},${v.cb})`;
  sh.border = (v.cr < 120 ? `1.5px solid #34363B` : 'none');

  // крапки-відлуння логотипа (велику малює сама фігура)
  const e = T.echo.at(t), ld = [...LOGO.querySelectorAll('.ldot')];
  ld[0].style.opacity = 0;
  [ld[1], ld[2]].forEach((c, i) => { const k = Math.max(0, e - i * 0.0); c.style.transform = `scale(${k * pulse})`; c.style.opacity = clamp(k * 1.5); });
  // літери: падають униз по черзі на старті, піднімаються з розмиттям наприкінці (кадр 0 = кадр 8)
  const letter = (el, tOut, tIn) => {
    let o, y, b;
    if (t < 3) { const x = clamp((t - tOut) / 0.22), xo = x * x * (3 - 2 * x); o = 1 - xo; y = xo * 260; b = xo * 6; }
    else { const k = stepR(t - tIn, { w: 20, z: 0.8 }); o = clamp(k * 1.4); y = (1 - k) * 300; b = (1 - clamp(k)) * 10; }
    el.style.opacity = o; el.style.transform = `translateY(${y}px)`; el.style.filter = b > 0.05 ? `blur(${b * 18}px)` : 'none';
  };
  LOGO.querySelectorAll('.ltr').forEach((el, i) => letter(el, 0.5 + i * 0.05, 7.0 + i * 0.07));
  LOGO.querySelectorAll('.ag').forEach((el, i) => letter(el, 0.35 + i * 0.02, 7.38 + i * 0.03));
  setVis($('c-ad'), vis(t, 1.15, 2.7));
  const vm = vis(t, 2.85, 4.0); setVis($('c-msg'), vm);
  const ty = vis(t, 2.85, 3.3), tx = vis(t, 3.35, 4.0);
  setVis($('typing'), ty); setVis($('msg-text'), tx);
  [...$('typing').children].forEach((d, i) => d.style.transform = `translateY(${-6 * Math.max(0, Math.sin((t * 8 - i * 0.6) * Math.PI))}px)`);
  setVis($('c-note'), vis(t, 4.32, 5.1));
  setVis($('c-stat'), vis(t, 5.45, 6.6));
  const roll = stepR(t - 5.9, { w: 18, z: 0.85 });
  $('odo').innerHTML = odo(clamp(roll, 0, 1.06));
  const pv = vis(t, 5.95, 6.6); $('plus').style.opacity = pv.o; $('plus').style.transform = `translateY(${pv.dy}px)`;
  [...bars.children].forEach((d, i) => { const k = stepR(t - 5.5 - i * 0.04, { w: 22, z: 0.85 }); d.style.transform = `scale(${k})`; d.style.background = i === 11 ? '#C6F432' : (i < 11 ? '#fff' : '#4A4C52'); d.style.opacity = i === 11 ? clamp((t - 5.9) * 6) : 0.85; });

  // button press + cursor
  const press = 1 - 0.16 * Math.exp(-(((t - CLICK) / 0.045) ** 2));
  $('ad-btn').style.transform = `scale(${1 - 0.05 * Math.exp(-(((t - CLICK) / 0.06) ** 2))})`;
  const ux = T.ux.at(t), uy = T.uy.at(t), vx = (T.ux.at(t + 0.01) - ux) / 0.01;
  const cur = $('cur').style; cur.left = ux + 'px'; cur.top = uy + 'px';
  cur.transform = `rotate(${clamp(-vx * 0.0045, -14, 14)}deg) scale(${press})`;
  $('pill').style.transform = `translateX(${clamp(-vx * 0.012, -18, 18)}px)`;
  const rp = clamp((t - CLICK) / 0.4); const rs = $('ripple').style;
  rs.opacity = t > CLICK ? (1 - rp) : 0; rs.transform = `scale(${0.4 + rp * 1.4})`;

  $('world').style.transform = `scale(${Math.exp(T.zoom.at(t))})`;
};
document.fonts.ready.then(() => { seek(0); window.ready = true; });
</script>
</body>
</html>
